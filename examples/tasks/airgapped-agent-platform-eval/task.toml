schema_version = "1.3"

[task]
name = "harbor/airgapped-agent-platform-eval"
description = "Verifies that an agent in a no-network environment cannot reach github.com, but can query Agent Platform to reverse 'HELLO' into 'OLLEH'."
authors = [{ name = "Vlad Kolesnikov" }]
keywords = ["network", "llm access", "antigravity", "no-internet"]

[metadata]
difficulty = "easy"
category = "infrastructure"
tags = ["network", "agent-platform", "airgap"]

[environment]
network_mode = "public"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[agent]
network_mode = "no-network"
timeout_sec = 300.0

[verifier]
timeout_sec = 60.0
