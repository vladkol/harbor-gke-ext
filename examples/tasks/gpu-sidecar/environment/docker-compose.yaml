services:
  main:
    build: .
    command: ["sleep", "infinity"]
    depends_on:
      model:
        condition: service_healthy
      mini-service:
        condition: service_healthy

  # `model` holds the GPU reservation AND collides with `mini-service` on port
  # 8080. The collision is what routes both sidecars into the DinD plane, which
  # is the whole point of this task: it is the only example that exercises a
  # GPU-requesting service *inside* DinD.
  model:
    image: python:3.12-slim
    hostname: model
    expose:
      - "8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - python3
      - -c
      - |
        import glob
        import json
        import os
        import subprocess
        from http.server import BaseHTTPRequestHandler, HTTPServer

        # GPU facts are gathered LAZILY, per request. Doing this at import time
        # would delay the socket bind and make a slow probe look like a startup
        # failure -- which is exactly how the earlier collision task failed.
        def gpu_facts():
            devs = sorted(glob.glob("/dev/nvidia*"))
            libdir = "/usr/local/nvidia/lib64"
            bindir = "/usr/local/nvidia/bin"
            lib_count = len(os.listdir(libdir)) if os.path.isdir(libdir) else 0
            smi = os.path.join(bindir, "nvidia-smi")
            smi_rc, smi_out = -1, "nvidia-smi-not-found"
            if os.path.exists(smi):
                try:
                    proc = subprocess.run(
                        [smi, "--query-gpu=name,memory.total,driver_version",
                         "--format=csv,noheader"],
                        capture_output=True, text=True, timeout=20,
                    )
                    smi_rc = proc.returncode
                    smi_out = (proc.stdout or proc.stderr).strip()
                except Exception as exc:
                    smi_rc, smi_out = -2, repr(exc)
            return {
                "service": "model",
                "port": 8080,
                "dev_nodes": devs,
                "driver_lib_count": lib_count,
                "ld_library_path": os.environ.get("LD_LIBRARY_PATH", ""),
                "nvidia_smi_rc": smi_rc,
                "nvidia_smi_out": smi_out,
            }

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path == "/status":
                    body = json.dumps(gpu_facts()).encode("utf-8")
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)
                else:
                    self.send_response(404)
                    self.end_headers()

            def log_message(self, format, *args):
                pass

        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
    # Deliberately a bare socket check: liveness must not depend on the GPU, so
    # that a GPU problem surfaces as a verifier failure with diagnostics rather
    # than an opaque unhealthy-container startup hang.
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 20

  mini-service:
    image: python:3.12-slim
    hostname: mini-service
    expose:
      - "8080"
    command:
      - python3
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path == "/health":
                    body = json.dumps(
                        {"status": "healthy", "service": "mini-service", "port": 8080}
                    ).encode("utf-8")
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)
                else:
                    self.send_response(404)
                    self.end_headers()

            def log_message(self, format, *args):
                pass

        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 20
